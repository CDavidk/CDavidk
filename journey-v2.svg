<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="958" viewBox="0 0 1000 958">
<style>
.s{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif;} .m{font-family:'Cascadia Code','JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace;}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.draw{transform-box:fill-box;transform-origin:top;transform:scaleY(0);animation:dr 1.4s ease-out forwards}
@keyframes dr{to{transform:scaleY(1)}}
.ping{transform-box:fill-box;transform-origin:center;animation:p 2s ease-out infinite}
@keyframes p{from{transform:scale(1);opacity:.9}to{transform:scale(2.6);opacity:0}}
.e0{opacity:0;animation:in .7s ease-out 0.20s forwards}.e1{opacity:0;animation:in .7s ease-out 0.55s forwards}.e2{opacity:0;animation:in .7s ease-out 0.90s forwards}.e3{opacity:0;animation:in .7s ease-out 1.25s forwards}.e4{opacity:0;animation:in .7s ease-out 1.60s forwards}
</style>

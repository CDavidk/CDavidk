ught</text><text x="244" y="290" class="s" font-size="14.5" fill="#c9d1d9"><tspan fill="#58a6ff">›</tspan>  Started programming with Python and C</text><rect x="244" y="308" width="66" height="24" rx="12" fill="#0d1117" stroke="#30363d"/><text x="277" y="324" text-anchor="middle" class="m" font-size="12" fill="#c9d1d9">Python</text><rect x="318.4" y="308" width="29" height="24" rx="12" fill="#0d1117" stroke="#30363d"/><text x="333" y="324" text-anchor="middle" class="m" font-size="12" fill="#c9d1d9">C</text></g><g class="e2"><text x="156" y="410" text-anchor="end" class="m" font-size="12" fill="#58a6ff" letter-spacing="2">2022 — 2025</text><text x="156" y="430" text-anchor="end" class="m" font-size="11" fill="#6e7681" letter-spacing="2">EXPLORING</text><circle cx="190" cy="405" r="7" fill="#0d1117" stroke="#6e7681" stroke-width="2"/><circle cx="190" cy="405" r="3" fill="#6e7681"/><rect x="220" y="376" width="779" height="156" rx="10" fill="#161b22" stroke="#30363d"/><text x="244" y="412" class="s" font-size="20" font-weight="700" fill="#f0f6fc">Design &amp; Hardware</text><text x="244" y="436" class="s" font-size="15" fill="#8b949e">Side projects</text><text x="244" y="468" class="s" font-size="14.5" fill="#c9d1d9"><tspan fill="#58a6ff">›</tspan>  Kept experimenting with design and hardware alongside code</text><rect x="244" y="486" width="66" height="24" rx="12" fill="#0d1117" stroke="#30363d"/><text x="277" y="502" text-anchor="middle" class="m" font-size="12" fill="#c9d1d9">Design</text><rect x="318.4" y="486" width="81" height="24" rx="12" fill="#0d1117" stroke="#30363d"/><text x="359" y="502" text-anchor="middle" class="m" font-size="12" fill="#c9d1d9">Hardware</text><rect x="407.59999999999997" y="486" width="103" height="24" rx="12" fill="#0d1117" stroke="#30363d"/><text x="459" y="502" text-anchor="middle" class="m" font-size="12" fill="#c9d1d9">Prototyping</text></g><g class="e3"><text x="156" y="588" text-anchor="end" class="m" font-size="12" fill="#58a6ff
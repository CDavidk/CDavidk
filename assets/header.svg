<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".07"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="45%" r="45%">
      <stop offset="0" stop-color="#1f6feb" stop-opacity=".28"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif; }
      .mono { font-family: 'Cascadia Code','JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace; }
      .in { opacity: 0; animation: in .8s ease-out forwards; }
      @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .ln { opacity: 0; animation: ln .35s ease-out forwards; }
      @keyframes ln { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
      .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: g 1s ease-out .6s forwards; }
      @keyframes g { to { transform: scaleX(1); } }
      .cur { animation: b 1s steps(1) infinite; } @keyframes b { 50% { opacity: 0; } }
      .k { fill: #58a6ff; } .s { fill: #a5d6ff; } .p { fill: #e6edf3; } .c { fill: #6e7681; }
    </style>
  </defs>

  <rect width="1200" height="340" rx="14" fill="#0d1117"/>
  <rect width="1200" height="340" rx="14" fill="url(#dots)"/>
  <rect width="1200" height="340" rx="14" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="339" rx="14" fill="none" stroke="#30363d"/>

  <!-- left: identity -->
  <text x="64" y="86" class="mono in" font-size="14" fill="#58a6ff" letter-spacing="3" style="animation-delay:.1s">SOFTWARE DEVELOPER</text>
  <text x="62" y="160" class="sans in" font-size="72" font-weight="700" fill="#f0f6fc" style="animation-delay:.25s">David Gómez</text>
  <rect x="64" y="184" width="300" height="3" rx="1.5" fill="url(#bar)" class="grow"/>
  <text x="64" y="222" class="sans in" font-size="19" fill="#c9d1d9" style="animation-delay:.5s">Frontend &amp; backend at <tspan fill="#f0f6fc" font-weight="600">CulturaSoft</tspan></text>
  <text x="64" y="252" class="sans in" font-size="17" fill="#8b949e" style="animation-delay:.6s">Systems Engineering student · UPB</text>
  <text x="64" y="296" class="mono in" font-size="13" fill="#6e7681" style="animation-delay:.8s">Cristhian David Gómez Mendoza  ·  Bucaramanga, CO</text>

  <!-- right: code window -->
  <g class="in" style="animation-delay:.4s">
    <rect x="660" y="44" width="480" height="256" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="660" y="44" width="480" height="34" rx="10" fill="#1c2128"/>
    <rect x="660" y="68" width="480" height="10" fill="#1c2128"/>
    <circle cx="682" cy="61" r="5.5" fill="#484f58"/>
    <circle cx="700" cy="61" r="5.5" fill="#484f58"/>
    <circle cx="718" cy="61" r="5.5" fill="#484f58"/>
    <text x="900" y="66" text-anchor="middle" class="mono" font-size="12" fill="#6e7681">developer.ts</text>
  </g>
  <g class="mono" font-size="15">
    <text x="684" y="110" xml:space="preserve" class="ln" style="animation-delay:.9s"><tspan class="k">const</tspan><tspan class="p"> david = {</tspan></text>
    <text x="684" y="136" xml:space="preserve" class="ln" style="animation-delay:1.1s"><tspan class="p">  role: </tspan><tspan class="s">'Analyst Programmer'</tspan><tspan class="p">,</tspan></text>
    <text x="684" y="162" xml:space="preserve" class="ln" style="animation-delay:1.3s"><tspan class="p">  front: [</tspan><tspan class="s">'Angular'</tspan><tspan class="p">, </tspan><tspan class="s">'TypeScript'</tspan><tspan class="p">],</tspan></text>
    <text x="684" y="188" xml:space="preserve" class="ln" style="animation-delay:1.5s"><tspan class="p">  back: [</tspan><tspan class="s">'Go'</tspan><tspan class="p">, </tspan><tspan class="s">'Java'</tspan><tspan class="p">, </tspan><tspan class="s">'PostgreSQL'</tspan><tspan class="p">],</tspan></text>
    <text x="684" y="214" xml:space="preserve" class="ln" style="animation-delay:1.7s"><tspan class="p">  next: [</tspan><tspan class="s">'GameDev'</tspan><tspan class="p">, </tspan><tspan class="s">'CyberSec'</tspan><tspan class="p">],</tspan></text>
    <text x="684" y="240" xml:space="preserve" class="ln" style="animation-delay:1.9s"><tspan class="p">  openToWork: </tspan><tspan class="k">true</tspan><tspan class="p">,</tspan></text>
    <text x="684" y="266" xml:space="preserve" class="ln" style="animation-delay:2.1s"><tspan class="p">};</tspan><tspan class="cur k"> ▌</tspan></text>
  </g>
</svg>
